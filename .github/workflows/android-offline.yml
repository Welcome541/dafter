name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/3df0eada-dafter
    paths:
      - 'android-offline/**'
      - 'index.html'
      - 'lib/**'
      - '.github/workflows/android-offline.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-offline/**/*.gradle*

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK manager not found. SDK root: $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: ./android-offline/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Dafter-Whisper-Offline
          path: Dafter-Whisper-Offline.apk
          if-no-files-found: error
          retention-days: 90
