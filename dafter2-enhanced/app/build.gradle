plugins {
    id 'com.android.application'
}

def signingFile = rootProject.file('signing.local.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'ai.arena.dafter.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.arena.dafter.enhanced'
        minSdk 21
        targetSdk 34
        versionCode 222
        versionName '2.22-responsive-offline'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
