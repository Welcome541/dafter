plugins {
    id 'com.android.application'
}

// The web app remains the single source of truth. Copy its offline shell and
// bundled libraries into the APK before Android packages the assets.
def webAppRoot = rootProject.projectDir.parentFile
def offlineWebAssets = layout.projectDirectory.dir('src/main/assets/www')
tasks.register('syncOfflineWebAssets', Sync) {
    from(webAppRoot) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'icon512.png'
        include 'lib/**'
    }
    into offlineWebAssets
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('syncOfflineWebAssets')
}

def signingFile = rootProject.file('signing.local.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'ai.arena.dafter.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.arena.dafter.offline'
        minSdk 24
        targetSdk 34
        versionCode 218
        versionName '2.18-whisper-offline'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
